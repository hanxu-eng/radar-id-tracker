[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-id-tracker"
version = "0.1.0"
description = "Online radar and 3D LiDAR box tracking with stable IDs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "hanxu-eng"}]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
radar-id-track = "radar_id_tracker.cli:main"
lidar-id-track = "radar_id_tracker.lidar_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_id_tracker = ["lidar_review.js", "lidar_review.html"]
